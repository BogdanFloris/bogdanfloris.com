<ul class="post-list">
  {% for post in posts %}
  <li class="post-row">
    <span class="date">{{ post.date }}</span>
    <span class="title"><a href="{{ post.url }}">{{ post.title }}</a></span>
    <span class="tags">
      {% for tag in post.tags %}{% if !loop.first %} · {% endif %}{{ tag }}{% endfor %}
    </span>
  </li>
  {% endfor %}
</ul>
